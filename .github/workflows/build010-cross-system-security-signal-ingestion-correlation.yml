name: cross-system security signal tests
on:
  push:
    branches:
      - implementation/build-010-04-cross-system-security-signal-ingestion-correlation
  pull_request:
    branches:
      - implementation/build-010-03-warranty-security-intelligence-threat-detection
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build010:cross-system-security-signal-ingestion-correlation
