name: Build 008 Build 001 migration validation

on:
  push:
    branches:
      - work/build008-build001-catalog-routes
  pull_request:
    branches:
      - build-008-inventory-foundation

jobs:
  fresh-database-migration-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Apply the complete migration chain to a fresh local database
        run: supabase db reset --local
      - name: Execute isolated PostgreSQL identity resolver tests
        run: supabase test db --local
      - name: Check migrated database for SQL issues
        run: supabase db lint --local
      - name: Stop isolated local Supabase stack
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          else
            echo "Supabase CLI was not installed; no local stack cleanup is required."
          fi
