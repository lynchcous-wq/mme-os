name: Build 009.62 fulfillment contracts
on:
  push:
    branches:
      - implementation/build-009-62-order-fulfillment-orchestration
  pull_request:
    branches:
      - implementation/build-009-61-inventory-reservation-allocation
jobs:
  fulfillment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build009:fulfillment
      - run: npm run test:build009:reservations
      - run: npm run test:build009:transfers
