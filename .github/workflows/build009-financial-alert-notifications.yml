name: Build 009.48 financial alert notification contracts
on:
  push:
    branches:
      - implementation/build-009-48-financial-alert-notifications
  pull_request:
    branches:
      - implementation/build-009-47-financial-command-center
jobs:
  financial-alert-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build009:financial-alert-notifications
      - run: npm run test:build009:financial-command-center
      - run: npm run test:build009:stripe-financial-intelligence
      - run: npm run test:build009:stripe-settlement-exceptions
      - run: npm run test:build009:settlement-integrity
