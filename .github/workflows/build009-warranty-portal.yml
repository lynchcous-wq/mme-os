name: Build 009.70 warranty portal contracts
on:
  push:
    branches: [implementation/build-009-70-warranty-customer-portal]
  pull_request:
    branches: [implementation/build-009-69-warranty-lifecycle-automation]
jobs:
  warranty-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm run lint
      - run: npm run test:build009:warranty-portal
