name: warranty security alerting tests
on:
  push:
    branches:
      - implementation/build-009-97-warranty-security-real-time-alerting
  pull_request:
    branches:
      - implementation/build-009-96-warranty-security-anomaly-detection
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build009:warranty-security-real-time-alerting
