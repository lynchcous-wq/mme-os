name: Build 008 fresh database migration validation

on:
  push:
    branches:
      - work/build008-build001-catalog-routes
  pull_request:
    branches:
      - build-008-inventory-foundation

jobs:
  fresh-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase
        run: supabase start
      - name: Apply the complete migration chain to a fresh database
        run: supabase db reset --local
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
