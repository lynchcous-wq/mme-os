name: Build 009.82 warranty retention alerts contracts
on:
  push:
    branches: [implementation/build-009-82-warranty-retention-alerts]
  pull_request:
    branches: [implementation/build-009-81-warranty-retention-worker]
jobs:
  warranty-retention-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build009:warranty-retention-alerts
