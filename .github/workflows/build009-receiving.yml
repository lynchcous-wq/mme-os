name: Build 009.58 receiving contracts
on:
  push:
    branches:
      - implementation/build-009-58-receiving-inventory-intake
  pull_request:
    branches:
      - implementation/build-009-57-purchasing-command-center
jobs:
  receiving:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build009:receiving
      - run: npm run test:build009:purchasing
