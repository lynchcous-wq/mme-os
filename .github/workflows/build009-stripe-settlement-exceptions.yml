name: Build 009.45 Stripe settlement exception contracts
on:
  push:
    branches:
      - implementation/build-009-45-stripe-settlement-exception-intelligence
  pull_request:
    branches:
      - implementation/build-009-44-stripe-refund-settlement-ledger
jobs:
  stripe-settlement-exceptions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build009:stripe-settlement-exceptions
      - run: npm run test:build009:stripe-refund-settlement
      - run: npm run test:build009:stripe-refunds
      - run: npm run test:build009:settlement-integrity
      - run: npm run test:build009:financial-reporting
