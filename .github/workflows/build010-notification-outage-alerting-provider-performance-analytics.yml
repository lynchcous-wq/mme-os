name: notification outage analytics tests
on:
  push:
    branches:
      - implementation/build-010-14-notification-outage-alerting-provider-performance-analytics
  pull_request:
    branches:
      - implementation/build-010-13-notification-provider-failover-health-monitoring
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build010:notification-outage-alerting-provider-performance-analytics
