name: notification provider receipt reconciliation tests
on:
  push:
    branches:
      - implementation/build-010-18-notification-provider-receipts-delivery-reconciliation
  pull_request:
    branches:
      - implementation/build-010-17-notification-delivery-dispatch-and-channel-adapters
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build010:notification-provider-receipts-delivery-reconciliation
