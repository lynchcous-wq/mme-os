name: Build 009.53 returns management contracts
on:
  push:
    branches:
      - implementation/build-009-53-returns-exchanges-refunds
  pull_request:
    branches:
      - implementation/build-009-52-customer-order-self-service
jobs:
  returns-management:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build009:returns-management
      - run: npm run test:build009:customer-order-portal
