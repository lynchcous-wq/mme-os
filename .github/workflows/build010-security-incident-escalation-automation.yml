name: security incident escalation automation tests
on:
  push:
    branches:
      - implementation/build-010-10-security-incident-escalation-automation
  pull_request:
    branches:
      - implementation/build-010-09-security-incident-escalation-case-management
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build010:security-incident-escalation-automation
