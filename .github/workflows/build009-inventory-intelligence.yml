name: Build 009.56 inventory intelligence contracts
on:
  push:
    branches:
      - implementation/build-009-56-inventory-intelligence-market-research
  pull_request:
    branches:
      - implementation/build-009-55-recovered-inventory-pricing-profitability
jobs:
  inventory-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build009:inventory-intelligence
      - run: npm run test:build009:recovered-pricing
