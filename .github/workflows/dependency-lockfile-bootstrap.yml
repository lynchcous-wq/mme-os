name: Dependency lockfile bootstrap

on:
  push:
    branches: ["security/build-001-dependency-lockfile"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): add npm lockfile" || echo "Lockfile unchanged"
          git push
      - name: Capture dependency audit
        run: npm audit --json > npm-audit.json || true
      - name: Preview non-forced audit remediation
        run: npm audit fix --dry-run --json > npm-audit-fix-plan.json || true
      - name: Upload generated lockfile and audit report
        uses: actions/upload-artifact@v4
        with:
          name: mme-dependency-bootstrap
          path: |
            package-lock.json
            npm-audit.json
            npm-audit-fix-plan.json
          if-no-files-found: error
          retention-days: 3
