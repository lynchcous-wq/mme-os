name: Build 009.88 warranty security escalation notifications
on:
  push:
    branches: [implementation/build-009-88-warranty-security-escalation-notifications]
  pull_request:
    branches: [implementation/build-009-87-warranty-security-detection-worker]
jobs:
  warranty-security-escalation-notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build009:warranty-security-escalation-notifications
