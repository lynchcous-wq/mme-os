name: security event source adapter tests
on:
  push:
    branches:
      - implementation/build-010-06-security-event-source-adapters-provider-health
  pull_request:
    branches:
      - implementation/build-010-05-security-event-reliability-retry-dead-letter
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build010:security-event-source-adapters-provider-health
