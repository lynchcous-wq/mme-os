name: Build 009.87 warranty security detection worker
on:
  push:
    branches: [implementation/build-009-87-warranty-security-detection-worker]
  pull_request:
    branches: [implementation/build-009-86-warranty-audit-security-monitoring]
jobs:
  warranty-security-detection-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build009:warranty-security-detection-worker
