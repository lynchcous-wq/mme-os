name: Build 009 Payments Center contract

on:
  push:
    branches:
      - implementation/build-009-enterprise-pos
  pull_request:
    branches:
      - implementation/build-009-enterprise-pos

jobs:
  payments-center-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build009:payments
