name: Build 009.60 transfer contracts
on:
  push:
    branches:
      - implementation/build-009-60-inventory-transfers-distribution
  pull_request:
    branches:
      - implementation/build-009-59-inventory-ledger-stock-posting
jobs:
  transfers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build009:transfers
      - run: npm run test:build009:inventory-ledger
