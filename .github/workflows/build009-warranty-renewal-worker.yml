name: Build 009.75 warranty renewal worker contracts
on:
  push:
    branches: [implementation/build-009-75-warranty-renewal-worker]
  pull_request:
    branches: [implementation/build-009-74-warranty-renewal]
jobs:
  renewal-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build009:warranty-renewal-worker
