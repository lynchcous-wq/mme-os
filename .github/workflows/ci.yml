name: MME OS CI

on:
  pull_request:
    branches: [main, "foundation/**"]
  push:
    branches: [main, "foundation/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Next.js type-check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Type-check web application
        run: npm run lint
      - name: Build application
        run: npm run build

  edge-functions:
    name: Supabase Edge Function type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check checkout and Stripe webhook
        run: |
          deno check supabase/functions/create-checkout-payment/index.ts
          deno check supabase/functions/stripe-webhook/index.ts
