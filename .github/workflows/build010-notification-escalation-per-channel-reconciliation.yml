name: notification escalation per-channel reconciliation tests
on:
  push:
    branches:
      - implementation/build-010-22-notification-escalation-per-channel-reconciliation
  pull_request:
    branches:
      - implementation/build-010-21-notification-escalation-scheduler-live-worker
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build010:notification-escalation-per-channel-reconciliation
