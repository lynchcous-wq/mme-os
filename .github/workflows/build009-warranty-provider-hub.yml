name: Build 009.68 warranty provider hub contracts
on:
  push:
    branches:
      - implementation/build-009-68-warranty-provider-integration-hub
  pull_request:
    branches:
      - implementation/build-009-67-warranty-fraud-risk-intelligence
jobs:
  warranty-provider-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:build009:warranty-provider-hub
      - run: npm run test:build009:warranty-risk
      - run: npm run test:build009:warranty-financial
      - run: npm run test:build009:warranty-repair
